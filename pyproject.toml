[project]
name = "gridsense3"
version = "1.0.0"
description = "Distributed MQTT EV charging simulation with Node-RED, SQLite and evaluated ML control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "xgboost>=2.1,<4",
]

[tool.uv]
package = false
