[project]
name = "gridsense3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Shibu", email = "Davidshibu5@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "acnportal>=0.3.3",
    "numpy>=2.5.4",
    "paho-mqtt>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.11,<2",
    "xgboost>=2.1,<4",
    "streamlit>=1.66.1",
]

[project.scripts]
gridsense3 = "gridsense3:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
